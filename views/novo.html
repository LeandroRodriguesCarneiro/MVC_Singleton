{% extends "base.html" %}

{% block head %}
    <title>Adicionar Novo Produto</title>
{% endblock %}

{% block body %}
    <h3 style="margin-bottom: 20px;">Adicionar Novo Produto</h3>
    
    <form action="{{ url_for('produtos.adicionar_produtos') }}" method="POST">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome do Produto</label>
            <input type="text" name="nome" id="nome" class="form-control" placeholder="Informe o nome do produto" required autofocus />
        </div>
        
        <div class="mb-3">
            <label for="preco" class="form-label">Preço</label>
            <input type="number" step="0.01" name="preco" id="preco" class="form-control" placeholder="Informe o preço do produto" required />
        </div>
        
        <div class="mb-3">
            <button type="submit" class="btn btn-primary">Cadastrar</button>
            <a href="{{ url_for('produtos.listar_produtos') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
{% endblock %}
